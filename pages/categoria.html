<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categoría | PopFlame</title>
    <meta name="description" content="Catálogo PopFlame. Streetwear que quema.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <a href="../index.html" class="logo">
                <img src="../images/logo.png" alt="PopFlame" class="logo-img">
            </a>

            <nav class="nav">
                <!-- Se llena solo con las categorías reales (js/app.js -> renderNav) -->
            </nav>

            <div class="header-actions">
                <button class="cart-btn" id="cartBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span class="cart-count" id="cartCount">0</span>
                </button>

                <button class="menu-btn" id="menuBtn">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </header>

    <!-- Page Header -->
    <section class="page-header">
        <div class="container">
            <h1 class="page-title" id="categoryTitle">CATEGORÍA</h1>
            <p class="page-subtitle" id="categorySubtitle"></p>
        </div>
    </section>

    <!-- Filters -->
    <section class="filters">
        <div class="container">
            <div class="filters-bar">
                <div class="filter-group">
                    <label>Talla:</label>
                    <select id="sizeFilter">
                        <option value="">Todas</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Color:</label>
                    <select id="colorFilter">
                        <option value="">Todos</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Ordenar:</label>
                    <select id="sortFilter">
                        <option value="default">Destacados</option>
                        <option value="price-asc">Precio: Menor a Mayor</option>
                        <option value="price-desc">Precio: Mayor a Menor</option>
                        <option value="name">Nombre</option>
                    </select>
                </div>
            </div>
        </div>
    </section>

    <!-- Products -->
    <section class="products">
        <div class="container">
            <div class="products-grid" id="categoryProducts">
                <!-- Products loaded via JS -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-grid">
                <div class="footer-col">
                    <img src="../images/logo.png" alt="PopFlame" class="footer-logo">
                    <p>Streetwear que quema 🔥</p>
                </div>

                <div class="footer-col">
                    <h4>TIENDA</h4>
                    <!-- Se llena solo (js/app.js -> renderFooterCategoryLinks) -->
                </div>

                <div class="footer-col">
                    <h4>AYUDA</h4>
                    <a href="info.html?slug=envios">Envíos</a>
                    <a href="info.html?slug=devoluciones">Devoluciones</a>
                    <a href="info.html?slug=guia-de-talles">Guía de Talles</a>
                    <a href="info.html?slug=contacto">Contacto</a>
                </div>

                <div class="footer-col">
                    <h4>REDES</h4>
                    <a href="#">Instagram</a>
                    <a href="#">TikTok</a>
                    <a href="#">Twitter</a>
                </div>
            </div>

            <div class="footer-bottom">
                <p>&copy; 2026 PopFlame. Todos los derechos reservados.</p>
            </div>
        </div>
    </footer>

    <!-- Cart Drawer -->
    <div class="cart-overlay" id="cartOverlay"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h3>TU CARRITO</h3>
            <button class="cart-close" id="cartClose">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <div class="cart-items" id="cartItems">
            <!-- Cart items loaded via JS -->
        </div>

        <div class="cart-footer" id="cartFooter">
            <div class="cart-total">
                <span>TOTAL:</span>
                <span id="cartTotal">$0</span>
            </div>
            <a href="checkout.html" class="btn btn-primary btn-full">FINALIZAR COMPRA</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabaseClient.js"></script>
    <script src="../js/products.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/app.js"></script>
    <script>
        let currentCategoryId = null;

        document.addEventListener('DOMContentLoaded', async () => {
            await ProductsManager.loadProducts();
            CartManager.init();
            App.applySiteConfig();
            App.renderNav();
            App.renderFooterCategoryLinks();

            currentCategoryId = App.getUrlParam('cat');
            const category = currentCategoryId ? ProductsManager.getCategoryById(currentCategoryId) : null;

            document.getElementById('categoryTitle').textContent = category ? category.name.toUpperCase() : 'TODOS LOS PRODUCTOS';
            document.getElementById('categorySubtitle').textContent = category ? (category.description || '') : 'Todo el catálogo PopFlame';
            document.title = (category ? category.name : 'Catálogo') + ' | PopFlame';

            // Marca el link activo en el menú (si existe esta categoría en la nav)
            document.querySelectorAll('.nav-link').forEach(a => {
                if (a.getAttribute('href') === `categoria.html?cat=${currentCategoryId}`) a.classList.add('active');
            });

            populateFilterOptions();
            renderCategoryProducts();

            document.getElementById('sizeFilter')?.addEventListener('change', applyFilters);
            document.getElementById('colorFilter')?.addEventListener('change', applyFilters);
            document.getElementById('sortFilter')?.addEventListener('change', applyFilters);
        });

        function getBaseProducts() {
            return currentCategoryId
                ? ProductsManager.getProductsByCategory(currentCategoryId)
                : ProductsManager.getAllProducts();
        }

        function populateFilterOptions() {
            const products = getBaseProducts();
            const sizes = new Set();
            const colors = new Set();
            products.forEach(p => {
                (p.sizes || []).forEach(s => sizes.add(s));
                (p.colors || []).forEach(c => colors.add(c));
            });

            const sizeSelect = document.getElementById('sizeFilter');
            sizes.forEach(s => sizeSelect.insertAdjacentHTML('beforeend', `<option value="${s}">${s}</option>`));

            const colorSelect = document.getElementById('colorFilter');
            colors.forEach(c => colorSelect.insertAdjacentHTML('beforeend', `<option value="${c}">${c}</option>`));
        }

        function renderCategoryProducts() {
            ProductsManager.renderProducts('categoryProducts', getBaseProducts(), true);
        }

        function applyFilters() {
            let products = getBaseProducts();

            const size = document.getElementById('sizeFilter')?.value;
            const color = document.getElementById('colorFilter')?.value;
            const sort = document.getElementById('sortFilter')?.value;

            if (size) products = products.filter(p => p.sizes.includes(size));
            if (color) products = products.filter(p => p.colors.includes(color));

            if (sort === 'price-asc') products.sort((a, b) => a.price - b.price);
            else if (sort === 'price-desc') products.sort((a, b) => b.price - a.price);
            else if (sort === 'name') products.sort((a, b) => a.name.localeCompare(b.name));

            ProductsManager.renderProducts('categoryProducts', products, true);
        }
    </script>
</body>
</html>
