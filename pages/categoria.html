<body data-page="category">
    <script src="../js/layout.js?v=7"></script>

    <main id="main" class="page-offset">
        <header class="page-head">
            <div class="container">
                <nav class="breadcrumbs" aria-label="Ruta">
                    <a href="../index.html">Inicio</a><span aria-hidden="true">/</span>
                    <span id="crumbCurrent">Catálogo</span>
                </nav>
                <h1 class="page-title" id="catTitle">Catálogo</h1>
                <p class="page-desc" id="catDesc">Todo lo que tenemos disponible en este momento.</p>
            </div>
        </header>

        <div class="toolbar">
            <div class="container toolbar-inner">
                <div class="toolbar-chips" id="catChips" aria-label="Categorías"></div>
                <div class="toolbar-filters">
                    <label class="sr-only" for="sizeFilter">Talla</label>
                    <select class="select" id="sizeFilter"><option value="">Talla</option></select>
                    <label class="sr-only" for="colorFilter">Color</label>
                    <select class="select" id="colorFilter"><option value="">Color</option></select>
                    <label class="sr-only" for="sortFilter">Ordenar</label>
                    <select class="select" id="sortFilter">
                        <option value="featured">Destacados</option>
                        <option value="new">Más nuevos</option>
                        <option value="price-asc">Precio: menor a mayor</option>
                        <option value="price-desc">Precio: mayor a menor</option>
                        <option value="name">Nombre A–Z</option>
                    </select>
                    <span class="result-count" id="resultCount" aria-live="polite"></span>
                </div>
            </div>
        </div>

        <section class="container" style="padding-bottom:96px">
            <div class="product-grid" id="catGrid"></div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2" defer></script>
