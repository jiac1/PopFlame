<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar | Admin PopFlame</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-logo">POPFLAME</div>
            <p class="login-sub">Panel de administración</p>

            <div class="error-msg" id="errorMsg"></div>

            <form id="loginForm">
                <div class="field">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" autocomplete="username" required>
                </div>
                <div class="field">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full" id="loginBtn">Ingresar</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabaseClient.js"></script>
    <script src="js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Si ya hay sesión válida, saltar directo al panel
            const profile = await AdminAuth.getActiveProfile();
            if (profile) {
                window.location.href = 'panel.html';
                return;
            }

            const form = document.getElementById('loginForm');
            const errorMsg = document.getElementById('errorMsg');
            const loginBtn = document.getElementById('loginBtn');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorMsg.style.display = 'none';
                loginBtn.disabled = true;
                loginBtn.textContent = 'Ingresando...';

                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;

                try {
                    await AdminAuth.login(username, password);
                    window.location.href = 'panel.html';
                } catch (err) {
                    errorMsg.textContent = err.message || 'No se pudo iniciar sesión';
                    errorMsg.style.display = 'block';
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Ingresar';
                }
            });
        });
    </script>
</body>
</html>
