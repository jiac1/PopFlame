<!DOCTYPE html>
<html lang="es-CL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Panel | PopFlame</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0B0B0B">
    <link rel="icon" href="../images/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
    <link rel="preconnect" href="https://ysxinhpymvhdnfbdanvn.supabase.co" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@110..125,700..900&family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="css/admin.css?v=6">
</head>
<body>
    <div class="app">
        <aside class="sidebar" id="sidebar" aria-label="Menú del panel">
            <div class="sidebar-brand">
                <img class="logo" src="../images/logo-sm.png" alt="" id="brandLogo">
                <div class="display name">PopFlame<small>Panel de administración</small></div>
            </div>
            <nav class="nav" id="nav"></nav>
            <div class="sidebar-foot">
                <div class="me">
                    <span class="avatar" id="meAvatar"></span>
                    <div><strong id="meName"></strong><span id="meRole"></span></div>
                </div>
                <div class="row">
                    <a class="btn" href="../index.html" target="_blank" rel="noopener">Ver tienda</a>
                    <button class="btn" id="logoutBtn">Salir</button>
                </div>
            </div>
        </aside>
        <div class="scrim" id="scrim"></div>

        <div class="main">
            <header class="topbar">
                <button class="icon-btn menu-btn" id="menuBtn" aria-label="Abrir menú" aria-controls="sidebar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 7h18M3 12h18M3 17h12"/></svg>
                </button>
                <div class="topbar-title">
                    <h1 class="display" id="pageTitle">Panel</h1>
                    <p id="pageSub"></p>
                </div>
                <div class="topbar-actions" id="pageActions"></div>
            </header>
            <main class="content" id="view" tabindex="-1"></main>
        </div>
    </div>

    <div class="overlay" id="sheetOverlay"></div>
    <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true">
        <div class="sheet-head">
            <h2 class="display" id="sheetTitle"></h2>
            <button class="icon-btn" data-sheet-close aria-label="Cerrar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
        </div>
        <div class="sheet-body" id="sheetBody"></div>
        <div class="sheet-foot" id="sheetFoot"></div>
    </aside>

    <div class="dialog" id="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialogTitle" aria-hidden="true">
        <div class="dialog-card">
            <div class="icon" id="dialogIcon"></div>
            <h3 id="dialogTitle"></h3>
            <p id="dialogText"></p>
            <div class="dialog-actions">
                <button class="btn btn-ghost" id="dialogCancel">Cancelar</button>
                <button class="btn btn-red" id="dialogOk">Confirmar</button>
            </div>
        </div>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
    <script src="../js/supabaseClient.js?v=6"></script>
    <script src="js/admin.js?v=6"></script>
    <script src="js/views-ventas.js?v=6"></script>
    <script src="js/views-catalogo.js?v=6"></script>
    <script src="js/views-sitio.js?v=6"></script>
    <script>
        (async () => {
            const profile = await AdminAuth.requireAuth();
            if (profile) AdminPanel.init(profile);
        })();
    </script>
</body>
</html>
