# Mantiene activo el proyecto de Supabase.
# En el plan gratis, Supabase pausa el proyecto tras ~7 días sin actividad y la tienda queda sin productos.
# Esta tarea hace una consulta mínima (1 producto) todos los días; no modifica ningún dato.
# Usa la clave pública (la misma que ya está en js/supabaseClient.js), así que no necesita secretos.
name: Mantener Supabase activo

on:
  schedule:
    - cron: '17 12 * * *'   # todos los días a las 12:17 UTC (~08:17 / 09:17 en Chile)
  workflow_dispatch:         # permite correrla a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar la base de datos
        env:
          SUPABASE_URL: https://ysxinhpymvhdnfbdanvn.supabase.co
          SUPABASE_KEY: sb_publishable_WHh5SfBgWKa7_XhFQRxGqQ_SrWk_u9H
        run: |
          status=$(curl -s -o response.json -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/products?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")
          echo "Respuesta de Supabase: HTTP $status"
          cat response.json; echo
          if [ "$status" != "200" ]; then
            echo "::error::Supabase no respondió (HTTP $status). Si el proyecto está pausado, reactívalo con 'Restore project' en el dashboard."
            exit 1
          fi
